image:
  repository: example-service
  tag: "1.0.0-dev"

replicaCount: 1

service:
  port: 8080

ingress:
  enabled: true
  className: apisix
  hosts:
    - host: example-service.dev.example.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 128Mi
