apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-service-dev
spec:
  project: default
  source:
    repoURL: https://example.invalid/example-service.git
    targetRevision: main
    path: config/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: example-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
