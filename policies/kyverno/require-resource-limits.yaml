apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-equal-resource-requests-limits
  annotations:
    platform-assistant.io/generation-hint: "When generating resources, set CPU and memory requests equal to limits."
    platform-assistant.io/constraint: "equal-resource-requests-limits"
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-equal-cpu-memory
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                - kyverno
      validate:
        message: "CPU and memory requests and limits are required and must be equal."
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: NotEquals
                    value: "{{ element.resources.limits.cpu || 'missing-limit' }}"
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: NotEquals
                    value: "{{ element.resources.limits.memory || 'missing-limit' }}"
